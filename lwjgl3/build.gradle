apply plugin: 'application'
application { mainClass = 'br.mackenzie.colheita.desktop.DesktopLauncher' }
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    ['natives-windows', 'natives-windows-x86', 'natives-windows-arm64',
     'natives-linux', 'natives-linux-arm64', 'natives-macos', 'natives-macos-arm64'].each { platform ->
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb'].each { module ->
            runtimeOnly "org.lwjgl:$module:$lwjglVersion:$platform"
        }
    }
}
tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
    if (project.hasProperty('capture')) args '--capture', project.property('capture')
}
tasks.register('fatJar', Jar) {
    archiveFileName = "colheita-em-movimento-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
